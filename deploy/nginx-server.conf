# The one HTTPS server on port 443. Each app adds its own routes in /etc/nginx/apps/<app>.conf
# and its files in /srv/http/<app>/.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name __HOSTNAME__;

    ssl_certificate __TLS_CERT__;
    ssl_certificate_key __TLS_KEY__;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /srv/http;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    include /etc/nginx/apps/*.conf;

    # The app that opens at the bare hostname.
    location = / {
        return 302 /chatappfriends/;
    }

    location / {
        return 404;
    }
}
