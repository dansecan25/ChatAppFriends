location = /chatappfriends {
    return 301 /chatappfriends/;
}

location /chatappfriends/ {
    # nginx drops inherited add_header lines once a block has its own, so each app lists them all.
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Permissions-Policy "microphone=(self), camera=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://__HOSTNAME__:8443; connect-src 'self' https://__HOSTNAME__:8443 wss://__HOSTNAME__:8443; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;

    expires -1;
    try_files $uri /chatappfriends/index.html;

    location /chatappfriends/assets/ {
        expires 1y;
        try_files $uri =404;
    }
}
